name: Release Obsidian plugin

on:
    release:
        types: [created]
    workflow_dispatch:
        inputs:
            tag:
                description: Existing tag to build and attach the assets to
                required: true

permissions:
    contents: write

env:
    PLUGIN_NAME: obsidian-daily-notes-editor

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # styles.css and main.js are build outputs and no longer tracked, so
            # a checkout alone cannot build the release: check them first.
            - name: Verify sources for the build outputs
              run: |
                  test -f src/style/index.css
                  test ! -f styles.css
                  test ! -f main.js

            - name: Build
              run: |
                  pnpm build
                  mkdir ${{ env.PLUGIN_NAME }}
                  cp main.js manifest.json styles.css ${{ env.PLUGIN_NAME }}
                  zip -r ${{ env.PLUGIN_NAME }}-v${{ github.event.release.tag_name || github.event.inputs.tag }}.zip ${{ env.PLUGIN_NAME }}

            - name: Upload release assets
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
                  files: |
                      main.js
                      manifest.json
                      styles.css
                      ${{ env.PLUGIN_NAME }}-v${{ github.event.release.tag_name || github.event.inputs.tag }}.zip
